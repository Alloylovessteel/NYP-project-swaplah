stages:
  - lint
  - test

pylint_check:
  stage: lint
  image: python:3.9
  script:
    - pip install pylint
    - pip install -r requirements.txt
    - pylint app/ --rcfile=setup.cfg

pytest_check:
  stage: test
  image: python:3.9
  script:
    - pip install -r requirements.txt
    - python -m pytest tests/unit/
    - python -m pytest tests/api/
    
