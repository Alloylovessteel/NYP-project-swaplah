<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwapLah - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title mb-4 text-center">SwapLah Login</h3>
                    <div id="error-msg" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="yourname@nyp.edu.sg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Password">
                    </div>
                    <button onclick="doLogin()" class="btn btn-primary w-100">Login</button>
                    <p class="text-center mt-3">No account? <a href="/register">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
async function doLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorMsg = document.getElementById('error-msg');

    const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok) {
        window.location.href = '/profile';
    } else {
        errorMsg.textContent = data.error;
        errorMsg.classList.remove('d-none');
    }
}
</script>
</body>
</html>
