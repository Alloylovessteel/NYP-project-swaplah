<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwapLah - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title mb-4 text-center">Create Account</h3>
                    <div id="error-msg" class="alert alert-danger d-none"></div>
                    <div id="success-msg" class="alert alert-success d-none"></div>
                    <div class="mb-3">
                        <label class="form-label">Student ID</label>
                        <input type="text" id="student_id" class="form-control" placeholder="e.g. 241011Z">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" id="first_name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" id="last_name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Display Name</label>
                        <input type="text" id="display_name" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">NYP Email</label>
                        <input type="email" id="email" class="form-control" placeholder="yourname@nyp.edu.sg">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contact Number</label>
                        <input type="text" id="contact_number" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="password" class="form-control">
                    </div>
                    <button onclick="doRegister()" class="btn btn-success w-100">Register</button>
                    <p class="text-center mt-3">Already have an account? <a href="/login">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
async function doRegister() {
    const errorMsg = document.getElementById('error-msg');
    const successMsg = document.getElementById('success-msg');
    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');

    const body = {
        student_id: document.getElementById('student_id').value,
        first_name: document.getElementById('first_name').value,
        last_name: document.getElementById('last_name').value,
        display_name: document.getElementById('display_name').value,
        email: document.getElementById('email').value,
        contact_number: document.getElementById('contact_number').value,
        password: document.getElementById('password').value
    };

    const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });

    const data = await res.json();

    if (res.ok) {
        successMsg.textContent = 'Registration successful! Redirecting to login...';
        successMsg.classList.remove('d-none');
        setTimeout(() => window.location.href = '/login', 1500);
    } else {
        errorMsg.textContent = data.error;
        errorMsg.classList.remove('d-none');
    }
}
</script>
</body>
</html>
