<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwapLah - My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .navbar { background: #1a73e8; }
        .navbar-brand { font-weight: 700; font-size: 1.5rem; color: white !important; }
        .card { border: none; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .profile-header { background: linear-gradient(135deg, #1a73e8, #0d47a1); border-radius: 16px 16px 0 0; padding: 2rem; text-align: center; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; color: #1a73e8; margin: 0 auto 1rem; border: 3px solid rgba(255,255,255,0.5); }
        .profile-name { color: white; font-size: 1.4rem; font-weight: 700; margin: 0; }
        .profile-id { color: rgba(255,255,255,0.8); font-size: 0.9rem; }
        .badge-status { background: rgba(255,255,255,0.2); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; display: inline-block; margin-top: 0.5rem; }
        .form-control { border-radius: 10px; padding: 0.75rem 1rem; border: 1.5px solid #e0e0e0; transition: all 0.2s; }
        .form-control:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,0.15); }
        .form-control:disabled { background: #f8f9fa; color: #666; }
        .btn-primary { background: #1a73e8; border: none; border-radius: 10px; padding: 0.75rem; font-weight: 600; }
        .btn-primary:hover { background: #0d47a1; }
        .btn-outline-danger { border-radius: 10px; padding: 0.75rem; font-weight: 600; }
        .input-group-text { border-radius: 0 10px 10px 0; border: 1.5px solid #e0e0e0; background: white; cursor: pointer; border-left: none; }
        .input-group .form-control { border-radius: 10px 0 0 10px; border-right: none; }
        .section-title { font-weight: 600; color: #333; font-size: 0.95rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #f0f4f8; }
        .alert { border-radius: 10px; font-size: 0.9rem; }
        .info-badge { background: #e8f0fe; color: #1a73e8; border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; }
        .strength-bar { height: 6px; border-radius: 3px; background: #e0e0e0; margin-top: 6px; }
        .strength-fill { height: 100%; border-radius: 3px; transition: all 0.3s; width: 0%; }
        .spinner-border { width: 1.2rem; height: 1.2rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="/marketplace">🔄 SwapLah</a>
        <div class="ms-auto d-flex gap-2">
            <a href="/marketplace" class="text-white text-decoration-none me-2 d-flex align-items-center"><i class="bi bi-shop me-1"></i> Marketplace</a>
            <button onclick="doLogout()" class="btn btn-light btn-sm fw-semibold"><i class="bi bi-box-arrow-right me-1"></i>Logout</button>
        </div>
    </div>
</nav>

<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div id="error-msg" class="alert alert-danger d-none mb-3">
                <i class="bi bi-exclamation-circle me-2"></i><span id="error-text"></span>
            </div>
            <div id="success-msg" class="alert alert-success d-none mb-3">
                <i class="bi bi-check-circle me-2"></i><span id="success-text"></span>
            </div>

            <div class="card mb-4">
                <div class="profile-header">
                    <div class="avatar" id="avatar-initials">?</div>
                    <p class="profile-name" id="profile-display-name">Loading...</p>
                    <p class="profile-id" id="profile-student-id"></p>
                    <span class="badge-status"><i class="bi bi-patch-check me-1"></i>Active Student</span>
                </div>
                <div class="card-body p-4">
                    <div class="info-badge mb-4">
                        <i class="bi bi-lock"></i>
                        <span>Student ID and Email cannot be changed after registration.</span>
                    </div>

                    <div class="section-title"><i class="bi bi-person me-2"></i>Personal Information</div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Student ID</label>
                        <input type="text" id="student_id" class="form-control" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="text" id="email" class="form-control" disabled>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold">First Name</label>
                            <input type="text" id="first_name" class="form-control">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label fw-semibold">Last Name</label>
                            <input type="text" id="last_name" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Display Name</label>
                        <input type="text" id="display_name" class="form-control" oninput="updateAvatar()">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Contact Number</label>
                        <div class="input-group">
                            <input type="tel" id="contact_number" class="form-control">
                            <span class="input-group-text"><i class="bi bi-phone text-muted"></i></span>
                        </div>
                    </div>

                    <div class="section-title"><i class="bi bi-shield-lock me-2"></i>Change Password <span class="text-muted fw-normal" style="font-size:0.85rem;">(leave blank to keep current)</span></div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Current Password</label>
                        <div class="input-group">
                            <input type="password" id="current_password" class="form-control" placeholder="Enter current password">
                            <span class="input-group-text" onclick="togglePassword('current_password', 'eye1')"><i class="bi bi-eye" id="eye1"></i></span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <input type="password" id="password" class="form-control" placeholder="Enter new password" oninput="checkStrength(this.value)">
                            <span class="input-group-text" onclick="togglePassword('password', 'eye2')"><i class="bi bi-eye" id="eye2"></i></span>
                        </div>
                        <div class="strength-bar mt-2"><div class="strength-fill" id="strength-fill"></div></div>
                        <div id="strength-text" class="form-text"></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <div class="input-group">
                            <input type="password" id="confirm_password" class="form-control" placeholder="Repeat new password" oninput="checkMatch()">
                            <span class="input-group-text" onclick="togglePassword('confirm_password', 'eye3')"><i class="bi bi-eye" id="eye3"></i></span>
                        </div>
                        <div id="match-text" class="form-text"></div>
                    </div>

                    <button onclick="doUpdate()" id="updateBtn" class="btn btn-primary w-100 mb-3">
                        <i class="bi bi-save me-2"></i>
                        <span id="btnText">Save Changes</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                    </button>
                    <button onclick="doLogout()" class="btn btn-outline-danger w-100">
                        <i class="bi bi-box-arrow-right me-2"></i>Logout
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    input.type = input.type === 'password' ? 'text' : 'password';
    icon.className = input.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}

function checkStrength(val) {
    const fill = document.getElementById('strength-fill');
    const text = document.getElementById('strength-text');
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;
    const colors = ['#e0e0e0','#dc3545','#fd7e14','#ffc107','#28a745'];
    const labels = ['','Weak','Fair','Good','Strong'];
    fill.style.width = (score * 25) + '%';
    fill.style.background = colors[score];
    text.innerHTML = score > 0 ? `<span style="color:${colors[score]}">${labels[score]} password</span>` : '';
}

function checkMatch() {
    const p = document.getElementById('password').value;
    const c = document.getElementById('confirm_password').value;
    const t = document.getElementById('match-text');
    if (c && p === c) {
        t.innerHTML = '<span class="text-success"><i class="bi bi-check-circle"></i> Passwords match</span>';
    } else if (c) {
        t.innerHTML = '<span class="text-danger"><i class="bi bi-x-circle"></i> Passwords do not match</span>';
    }
}

function updateAvatar() {
    const name = document.getElementById('display_name').value || '?';
    document.getElementById('avatar-initials').textContent = name.charAt(0).toUpperCase();
    document.getElementById('profile-display-name').textContent = name;
}

async function loadProfile() {
    const res = await fetch('/api/profile');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const data = await res.json();
    document.getElementById('student_id').value = data.student_id;
    document.getElementById('email').value = data.email;
    document.getElementById('first_name').value = data.first_name;
    document.getElementById('last_name').value = data.last_name;
    document.getElementById('display_name').value = data.display_name;
    document.getElementById('contact_number').value = data.contact_number;
    document.getElementById('profile-display-name').textContent = data.display_name;
    document.getElementById('profile-student-id').textContent = data.student_id + ' · ' + data.email;
    document.getElementById('avatar-initials').textContent = data.display_name.charAt(0).toUpperCase();
}

async function doUpdate() {
    const errorMsg = document.getElementById('error-msg');
    const errorText = document.getElementById('error-text');
    const successMsg = document.getElementById('success-msg');
    const successText = document.getElementById('success-text');
    const btn = document.getElementById('updateBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('btnSpinner');

    errorMsg.classList.add('d-none');
    successMsg.classList.add('d-none');

    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm_password').value;

    if (password && password !== confirm) {
        errorText.textContent = 'New passwords do not match.';
        errorMsg.classList.remove('d-none');
        return;
    }

    const body = {
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        display_name: document.getElementById('display_name').value.trim(),
        contact_number: document.getElementById('contact_number').value.trim()
    };

    if (password) {
        body.password = password;
        body.current_password = document.getElementById('current_password').value;
    }

    btn.disabled = true;
    btnText.textContent = 'Saving...';
    spinner.classList.remove('d-none');

    try {
        const res = await fetch('/api/profile', {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (res.ok) {
            successText.textContent = 'Profile updated successfully!';
            successMsg.classList.remove('d-none');
            document.getElementById('current_password').value = '';
            document.getElementById('password').value = '';
            document.getElementById('confirm_password').value = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            errorText.textContent = data.error;
            errorMsg.classList.remove('d-none');
        }
    } catch (err) {
        errorText.textContent = 'Something went wrong. Please try again.';
        errorMsg.classList.remove('d-none');
    }

    btn.disabled = false;
    btnText.textContent = 'Save Changes';
    spinner.classList.add('d-none');
}

async function doLogout() {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
}

loadProfile();
</script>
</body>
</html>
