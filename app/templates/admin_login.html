<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SwapLah - Administrator Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: #1a73e8;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            color: white !important;
        }

        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            border-radius: 16px 16px 0 0 !important;
            padding: 2rem;
        }

        .card-header h4 {
            color: white;
            font-weight: 700;
            margin: 0;
        }

        .card-header p {
            color: rgba(255, 255, 255, 0.8);
            margin: 0.25rem 0 0;
            font-size: 0.9rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1.5px solid #e0e0e0;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: #1a73e8;
            box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
        }

        .btn-primary {
            background: #1a73e8;
            border: none;
            border-radius: 10px;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            background: #0d47a1;
            transform: translateY(-1px);
        }

        .input-group-text {
            border-radius: 0 10px 10px 0;
            border: 1.5px solid #e0e0e0;
            background: white;
            cursor: pointer;
            border-left: none;
        }

        .input-group .form-control {
            border-radius: 10px 0 0 10px;
            border-right: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: #999;
            font-size: 0.85rem;
            margin: 1rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e0e0e0;
        }

        .alert {
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .form-check-input:checked {
            background-color: #1a73e8;
            border-color: #1a73e8;
        }

        .spinner-border {
            width: 1.2rem;
            height: 1.2rem;
        }

        .logo-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/marketplace">🔄 SwapLah</a>
            <div class="ms-auto">
                <a href="/marketplace" class="text-white text-decoration-none me-3"><i class="bi bi-shop"></i>
                    Marketplace</a>
                <a href="/register" class="btn btn-light btn-sm fw-semibold">Register</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header text-center">
                        <div class="logo-icon">🔄</div>
                        <h4>Administrator Login</h4>
                        <p>Sign in using your administrator account</p>
                    </div>
                    <div class="card-body p-4">
                        <div id="error-msg" class="alert alert-danger d-none">
                            <i class="bi bi-exclamation-circle me-2"></i><span id="error-text"></span>
                        </div>
                        <div id="success-msg" class="alert alert-success d-none">
                            <i class="bi bi-check-circle me-2"></i><span id="success-text"></span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">NYP Email</label>
                            <div class="input-group">
                                <input type="email" id="email" class="form-control" placeholder="yourname@nyp.edu.sg"
                                    autocomplete="email">
                                <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                            </div>
                            <div class="form-text text-muted"><i class="bi bi-info-circle"></i> Must be a @nyp.edu.sg or
                                @mymail.nyp.edu.sg address</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <input type="password" id="password" class="form-control"
                                    placeholder="Enter your password" autocomplete="current-password">
                                <span class="input-group-text" onclick="togglePassword('password', 'eye1')">
                                    <i class="bi bi-eye" id="eye1"></i>
                                </span>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember">
                                <label class="form-check-label text-muted" for="remember">Remember me</label>
                            </div>
                            <a href="/forgot-password" class="text-decoration-none"
                                style="color:#1a73e8; font-size:0.9rem;">Forgot password?</a>
                        </div>

                        <button onclick="doLogin()" id="loginBtn" class="btn btn-primary w-100 mb-3">
                            <span id="btnText">Sign In</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                        </button>

                        <div class="divider">or</div>

                        <p class="text-center text-muted mb-0" style="font-size:0.9rem;">
                            Don't have an account? <a href="/register" class="text-decoration-none fw-semibold"
                                style="color:#1a73e8;">Create one here</a>
                        </p>
                    </div>
                </div>

                <p class="text-center text-muted mt-3" style="font-size:0.8rem;">
                    <i class="bi bi-shield-lock"></i> Your session is secured and expires after 30 minutes of
                    inactivity.
                </p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye';
            }
        }

        document.getElementById('password').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') doLogin();
        });

        async function doLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const errorText = document.getElementById('error-text');
            const successMsg = document.getElementById('success-msg');
            const successText = document.getElementById('success-text');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            errorMsg.classList.add('d-none');
            successMsg.classList.add('d-none');

            if (!email || !password) {
                errorText.textContent = 'Please fill in all fields.';
                errorMsg.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            btnText.textContent = 'Signing in...';
            spinner.classList.remove('d-none');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    successText.textContent = 'Login successful! Redirecting...';
                    successMsg.classList.remove('d-none');
                    setTimeout(() => window.location.href = '/admin/reports', 1000);
                } else {
                    errorText.textContent = data.error;
                    errorMsg.classList.remove('d-none');
                    btn.disabled = false;
                    btnText.textContent = 'Sign In';
                    spinner.classList.add('d-none');
                }
            } catch (err) {
                errorText.textContent = 'Something went wrong. Please try again.';
                errorMsg.classList.remove('d-none');
                btn.disabled = false;
                btnText.textContent = 'Sign In';
                spinner.classList.add('d-none');
            }
        }
    </script>
</body>

</html>
